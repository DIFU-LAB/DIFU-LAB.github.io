name: Deploy Cloudflare visitor map
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    defaults:
      run:
        working-directory: integrations/visitor-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure managed database
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.example.toml > wrangler.toml
      - name: Apply idempotent schema
        run: npx --yes wrangler@4 d1 execute seil-visitors --remote --file=schema.sql
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
