name: Build and deploy SEIL Lab
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - uses: actions/cache@v4
        with:
          path: |
            client/public/media/_responsive
            .cache/responsive-media.json
            client/public/media/fonts/latin.css
            client/public/media/fonts/latin-*.woff2
            client/public/media/fonts/EB-Garamond-OFL.txt
            client/public/media/fonts/Source-Sans-3-OFL.txt
          key: media-v1-${{ hashFiles('scripts/prepare-images.py', 'scripts/prepare-fonts.py', 'client/public/media/**/*.jpg', 'client/public/media/**/*.jpeg', 'client/public/media/**/*.png', 'client/public/media/**/*.webp', 'client/public/media/**/*.avif') }}
          restore-keys: |
            media-v1-
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm check
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_VISITOR_MAP_ENDPOINT: ${{ vars.VITE_VISITOR_MAP_ENDPOINT }}
        run: pnpm build
      - name: Verify static deployment
        run: |
          node scripts/check-build.mjs
          pnpm test
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
